name: Build Android Bundle (.aab)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install

    - name: Build Web Assets
      run: npm run build

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle with Java 17
      uses: gradle/actions/setup-gradle@v3
      with:
        java-version: '17'

    - name: Generate Native Android Project
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init ConducePro com.conducepro.app --web-dir dist || true
        
        rm -rf android
        npx cap add android
        
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_PATH" ]; then
          sed -i '/<\/manifest>/i \    <uses-permission android:name="com.android.vending.BILLING" \/>' "$MANIFEST_PATH"
        fi
        
        GRADLE_PATH="android/build.gradle"
        if [ -f "$GRADLE_PATH" ]; then
          echo 'subprojects { configurations.all { exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"; exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7" } }' >> "$GRADLE_PATH"
        fi

        npx cap sync android

    - name: Build Android App Bundle (.aab)
      run: |
        cd android
        gradle bundleRelease -Pandroid.useAndroidX=true -Pandroid.enableJetifier=false

    - name: Upload .aab Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/bundle/release/app-release.aab
