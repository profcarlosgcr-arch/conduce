name: Build Android Bundle (.aab)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Node Dependencies
      run: npm install

    - name: Build Web Assets
      run: npm run build

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup & Sync Capacitor 5 (Stable)
      run: |
        npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
        npx cap init ConducePro com.conducepro.app --web-dir dist || true
        rm -rf android
        npx cap add android
        
        # Inyecta el permiso de Billing para Google Play Console
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST_PATH" ]; then
          sed -i '/<\/manifest>/i \    <uses-permission android:name="com.android.vending.BILLING" \/>' "$MANIFEST_PATH"
        fi
        
        npx cap sync android

    - name: Build Android App Bundle (.aab)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: Upload .aab Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/bundle/release/app-release.aab
